<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genetiikkageneraattori</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 15px;
            max-width: 500px;
            margin: auto;
            background-color: #f4f4f9;
        }
        .card {
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 15px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 4px;
        }
        label {
            font-size: 10px;
            font-weight: bold;
            display: block;
            margin-bottom: 2px;
            text-align: center;
        }
        select {
            width: 100%;
            padding: 6px 1px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 11px;
        }
        button {
            width: 100%;
            background-color: #007aff;
            color: white;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 12px;
            padding: 12px;
            font-size: 15px;
        }
        .btn-download {
            background-color: #34c759;
            margin-top: 8px;
        }
        #canvas {
            width: 100%;
            height: auto;
            border-radius: 8px;
            background: #fff;
            display: block;
        }
        .tulos {
            margin-top: 10px;
            font-weight: bold;
            text-align: center;
            font-size: 13px;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Vanhempien geenit</h2>
        
        <h3>Isä</h3>
        <div class="grid">
            <div>
                <label>M (Harja)</label>
                <select id="isa_m"><option>MM</option><option selected>Mm</option><option>mm</option></select>
            </div>
            <div>
                <label>C (Kihara)</label>
                <select id="isa_c"><option>CC</option><option selected>Cc</option><option>cc</option></select>
            </div>
            <div>
                <label>B (Keho)</label>
                <select id="isa_b">
                    <option value="BB">BB</option>
                    <option value="Bb" selected>Bb</option>
                    <option value="Bb1">Bb1</option>
                    <option value="bb">bb</option>
                    <option value="bb1">bb1</option>
                    <option value="b1b1">b1b1</option>
                </select>
            </div>
            <div>
                <label>H (H.Väri)</label>
                <select id="isa_h"><option>HH</option><option selected>Hh</option><option>hh</option></select>
            </div>
            <div>
                <label>O (Puna)</label>
                <select id="isa_o"><option selected>OO</option><option>Oo</option><option>oo</option></select>
            </div>
            <div>
                <label>N (Kuvio)</label>
                <select id="isa_n"><option>NN</option><option selected>Nn</option><option>nn</option></select>
            </div>
        </div>

        <h3>Emä</h3>
        <div class="grid">
            <div>
                <label>M (Harja)</label>
                <select id="ema_m"><option>MM</option><option selected>Mm</option><option>mm</option></select>
            </div>
            <div>
                <label>C (Kihara)</label>
                <select id="ema_c"><option>CC</option><option selected>Cc</option><option>cc</option></select>
            </div>
            <div>
                <label>B (Keho)</label>
                <select id="ema_b">
                    <option value="BB">BB</option>
                    <option value="Bb" selected>Bb</option>
                    <option value="Bb1">Bb1</option>
                    <option value="bb">bb</option>
                    <option value="bb1">bb1</option>
                    <option value="b1b1">b1b1</option>
                </select>
            </div>
            <div>
                <label>H (H.Väri)</label>
                <select id="ema_h"><option>HH</option><option selected>Hh</option><option>hh</option></select>
            </div>
            <div>
                <label>O (Puna)</label>
                <select id="ema_o"><option selected>OO</option><option>Oo</option><option>oo</option></select>
            </div>
            <div>
                <label>N (Kuvio)</label>
                <select id="ema_n"><option>NN</option><option selected>Nn</option><option>nn</option></select>
            </div>
        </div>

        <button onclick="arvoPentu()">Arvo pentu!</button>
    </div>

    <div class="card">
        <canvas id="canvas" width="2163" height="1361"></canvas>
        <div id="tulos" class="tulos">Valitse vanhemmat ja paina nappia.</div>
        <button class="btn-download" onclick="lataaKuvaLaitteelle()">Lataa kuva laitteelle (PNG)</button>
    </div>

    <script>
        // Arvotaan yksi alleeli vanhemman genotyypistä
        function arvoAlleeli(genotyyppi) {
            let alleelit = [];
            if (genotyyppi === "BB") alleelit = ["B", "B"];
            else if (genotyyppi === "Bb") alleelit = ["B", "b"];
            else if (genotyyppi === "Bb1") alleelit = ["B", "b1"];
            else if (genotyyppi === "bb") alleelit = ["b", "b"];
            else if (genotyyppi === "bb1") alleelit = ["b", "b1"];
            else if (genotyyppi === "b1b1") alleelit = ["b1", "b1"];
            else alleelit = [genotyyppi[0], genotyyppi[1]];

            return alleelit[Math.floor(Math.random() * 2)];
        }

        // Luo ja järjestää genotyypin oikeaan järjestykseen (esim. B > b > b1)
        function luoGenotyyppi(g1, g2, onkoBGeeni = false) {
            let a1 = arvoAlleeli(g1);
            let a2 = arvoAlleeli(g2);

            if (onkoBGeeni) {
                // Dominanssipainot B-geenille
                const arvo = (a) => (a === "B" ? 3 : a === "b" ? 2 : 1);
                let lista = [a1, a2].sort((a, b) => arvo(b) - arvo(a));
                return lista.join("");
            }

            return [a1, a2].sort().join("");
        }

        function varioiHSL(h, s, l) {
            let dH = h + (Math.random() * 10 - 5);
            let dS = Math.max(0, Math.min(100, s + (Math.random() * 10 - 5)));
            let dL = Math.max(0, Math.min(100, l + (Math.random() * 12 - 6)));
            return `hsl(${dH}, ${dS}%, ${dL}%)`;
        }

        function piirraCalicoLaikut(ctx, width, height, vari, maara = 10) {
            ctx.fillStyle = vari;
            for (let i = 0; i < maara; i++) {
                let keskiX = Math.random() * width;
                let keskiY = Math.random() * height;
                let ympyroita = 6 + Math.floor(Math.random() * 8);

                ctx.beginPath();
                for (let j = 0; j < ympyroita; j++) {
                    let offsetX = (Math.random() - 0.5) * 180;
                    let offsetY = (Math.random() - 0.5) * 180;
                    let sade = 40 + Math.random() * 90;
                    ctx.arc(keskiX + offsetX, keskiY + offsetY, sade, 0, Math.PI * 2);
                }
                ctx.fill();
            }
        }

        function arvoPentu() {
            // 1. Lue valikot
            let isaM = document.getElementById("isa_m").value;
            let isaC = document.getElementById("isa_c").value;
            let isaB = document.getElementById("isa_b").value;
            let isaH = document.getElementById("isa_h").value;
            let isaO = document.getElementById("isa_o").value;
            let isaN = document.getElementById("isa_n").value;

            let emaM = document.getElementById("ema_m").value;
            let emaC = document.getElementById("ema_c").value;
            let emaB = document.getElementById("ema_b").value;
            let emaH = document.getElementById("ema_h").value;
            let emaO = document.getElementById("ema_o").value;
            let emaN = document.getElementById("ema_n").value;

            // 2. Arvo pennun genotyypit
            let pentuM = luoGenotyyppi(isaM, emaM);
            let pentuC = luoGenotyyppi(isaC, emaC);
            let pentuB = luoGenotyyppi(isaB, emaB, true); // true = B-geeni
            let pentuH = luoGenotyyppi(isaH, emaH);
            let pentuO = luoGenotyyppi(isaO, emaO);
            let pentuN = luoGenotyyppi(isaN, emaN);

            // 3. Määritä fenotyypit
            let onkoHarja = pentuM.includes("M");
            let onkoKihara = (pentuC === "cc");

            // B-geenin fenotyypin määritys dominanssijärjestyksessä (B > b > b1)
            let tummaHSL, tummaNimi;
            if (pentuB.includes("B")) {
                tummaHSL = { h: 30, s: 5, l: 18 };
                tummaNimi = "Musta";
            } else if (pentuB.includes("b")) {
                tummaHSL = { h: 25, s: 40, l: 25 };
                tummaNimi = "Ruskea";
            } else {
                tummaHSL = { h: 20, s: 50, l: 40 };
                tummaNimi = "Kaneli";
            }

            // Harjan väri (H-geeni)
            let harjaHSL, harjaNimi;
            if (pentuH.includes("H") && pentuH.includes("h")) {
                harjaHSL = { h: 25, s: 35, l: 25 };
                harjaNimi = "Ruskea harja";
            } else if (pentuH === "HH") {
                harjaHSL = { h: 30, s: 5, l: 15 };
                harjaNimi = "Musta harja";
            } else {
                harjaHSL = { h: 35, s: 60, l: 70 };
                harjaNimi = "Vaalea harja";
            }

            // O-geeni
            let punainenHSL = (pentuO === "oo") 
                ? { h: 32, s: 60, l: 75 } 
                : { h: 20, s: 80, l: 50 };

            let variTumma = varioiHSL(tummaHSL.h, tummaHSL.s, tummaHSL.l);
            let variPunainen = varioiHSL(punainenHSL.h, punainenHSL.s, punainenHSL.l);
            let variHarja = varioiHSL(harjaHSL.h, harjaHSL.s, harjaHSL.l);

            let paavari = "";
            let laikkavari = null;

            if (pentuN === "NN") paavari = variTumma;
            else if (pentuN === "nn") paavari = variPunainen;
            else {
                paavari = variPunainen;
                laikkavari = variTumma;
            }

            // 4. Kuvatiedostot
            let pohjaTiedosto = onkoKihara 
                ? "Untitled309_20261008151142.png" 
                : "Untitled309_20261008151151.png";

            let pohjaHarjaTiedosto = onkoHarja 
                ? (onkoKihara ? "Untitled309_20261008151613.png" : "Untitled309_20261008151605.png") 
                : null;

            let viivaTiedosto = onkoKihara 
                ? "Untitled309_20261008153435.png" 
                : "Untitled309_20261008153442.png";

            let viivaHarjaTiedosto = onkoHarja 
                ? (onkoKihara ? "Untitled309_20261008153420.png" : "Untitled309_20261008153429.png") 
                : null;

            // 5. Tekstit
            let harjaTeksti = onkoHarja ? `Harja (${harjaNimi})` : "Ei harjaa";

            document.getElementById("tulos").innerText = 
                `Genotyyppi: ${pentuM} / ${pentuC} / ${pentuB} / ${pentuH} / ${pentuO} / ${pentuN}\n` +
                `Ominaisuudet: ${harjaTeksti}, Kehon tumma sävy: ${tummaNimi}`;

            // 6. Piirto
            piirraErillinenHarjaPentu(pohjaTiedosto, pohjaHarjaTiedosto, viivaTiedosto, viivaHarjaTiedosto, paavari, laikkavari, variHarja);
        }

        function lataaKuva(url) {
            return new Promise((resolve) => {
                if (!url) return resolve(null);
                const img = new Image();
                img.onload = () => resolve(img);
                img.onerror = () => resolve(null);
                img.src = url;
            });
        }

        async function piirraErillinenHarjaPentu(pohja, pohjaHarja, viiva, viivaHarja, kehoVari, laikkavari, harjaVari) {
            const canvas = document.getElementById("canvas");
            const ctx = canvas.getContext("2d");
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const [imgPohja, imgPohjaHarja, imgViiva, imgViivaHarja] = await Promise.all([
                lataaKuva(pohja),
                lataaKuva(pohjaHarja),
                lataaKuva(viiva),
                lataaKuva(viivaHarja)
            ]);

            // VAIHE 1: KEHO
            if (imgPohja) {
                ctx.globalCompositeOperation = "source-over";
                ctx.drawImage(imgPohja, 0, 0, canvas.width, canvas.height);

                ctx.globalCompositeOperation = "source-in";
                ctx.fillStyle = kehoVari;
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                if (laikkavari) {
                    ctx.globalCompositeOperation = "source-atop";
                    piirraCalicoLaikut(ctx, canvas.width, canvas.height, laikkavari, 10);
                }
            }

            // VAIHE 2: HARJA
            if (imgPohjaHarja) {
                const tempCanvas = document.createElement("canvas");
                tempCanvas.width = canvas.width;
                tempCanvas.height = canvas.height;
                const tempCtx = tempCanvas.getContext("2d");

                tempCtx.drawImage(imgPohjaHarja, 0, 0, canvas.width, canvas.height);
                tempCtx.globalCompositeOperation = "source-in";
                tempCtx.fillStyle = harjaVari;
                tempCtx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.globalCompositeOperation = "source-over";
                ctx.drawImage(tempCanvas, 0, 0);
            }

            // VAIHE 3: ÄÄRIVIIVAT
            ctx.globalCompositeOperation = "source-over";
            if (imgViiva) ctx.drawImage(imgViiva, 0, 0, canvas.width, canvas.height);
            if (imgViivaHarja) ctx.drawImage(imgViivaHarja, 0, 0, canvas.width, canvas.height);
        }

        function lataaKuvaLaitteelle() {
            const canvas = document.getElementById("canvas");
            const latausLinkki = document.createElement("a");
            latausLinkki.download = "genetiikkapentu.png";
            latausLinkki.href = canvas.toDataURL("image/png");
            document.body.appendChild(latausLinkki);
            latausLinkki.click();
            document.body.removeChild(latausLinkki);
        }
    </script>
</body>
</html>
