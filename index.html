<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genetiikkageneraattori</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 15px;
            max-width: 620px;
            margin: auto;
            background-color: #f4f4f9;
        }
        .card {
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 15px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(11, 1fr);
            gap: 3px;
        }
        .grid-2 {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }
        label {
            font-size: 8px;
            font-weight: bold;
            display: block;
            margin-bottom: 2px;
            text-align: center;
        }
        select {
            width: 100%;
            padding: 4px 0px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 9px;
        }
        input[type="color"] {
            width: 100%;
            height: 40px;
            border: 1px solid #ccc;
            border-radius: 6px;
            cursor: pointer;
        }
        input[type="text"] {
            width: 100%;
            padding: 6px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 10px;
            font-family: monospace;
        }
        .color-input-group {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .color-input-group input[type="color"] {
            flex: 0 0 50px;
            height: 35px;
            width: 50px;
        }
        .color-input-group input[type="text"] {
            flex: 1;
        }
        button {
            width: 100%;
            background-color: #007aff;
            color: white;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 12px;
            padding: 12px;
            font-size: 15px;
        }
        .btn-download {
            background-color: #34c759;
            margin-top: 8px;
        }
        #canvas {
            width: 100%;
            height: auto;
            border-radius: 8px;
            background: #fff;
            display: block;
        }
        .tulos {
            margin-top: 10px;
            font-weight: bold;
            text-align: center;
            font-size: 13px;
            line-height: 1.4;
            white-space: pre-wrap;
        }
    </style>
</head>

    <script>
        // Lineart-tiedostot
        const eyeLinearts = [
            "Untitled309_20261009091214.png",
            "Untitled309_20261009091209.png",
            "Untitled309_20261009091204.png",
            "Untitled309_20261008221019.png",
            "Untitled309_20261008221015.png"
        ];

        const mouthLinearts = [
            "Untitled309_20261009102847.png",
            "Untitled309_20261009102854.png",
            "Untitled309_20261009102859.png",
            "Untitled309_20261009103005.png",
            "Untitled309_20261009103224.png",
            "Untitled309_20261009103305.png"
        ];

        const noseData = {
            smooth: { skin: "Untitled309_20261009100656.png", lineart: "Untitled309_20261009100650.png" },
            big: { skin: "Untitled309_20261009100705.png", lineart: "Untitled309_20261009100701.png" },
            sharp: { skin: "Untitled309_20261009100716.png", lineart: "Untitled309_20261009100711.png" }
        };

        const earsAndPawsSkinFile = "Untitled309_20261009100644.png";

        // RAITA-ASSETIT (Limbs, Body, Face)
        const stripeAssets = {
            limbs: [
                { color: "Untitled311_20261009184723.png", outline: "Untitled311_20261009184731.png" }, // Paksu
                { color: "Untitled311_20261009184737.png", outline: "Untitled311_20261009184741.png" }, // Terävä
                { color: "Untitled311_20261009184746.png", outline: "Untitled311_20261009184751.png" }  // Ohut
            ],
            body: [
                { color: "Untitled311_20261009184756.png", outline: "Untitled311_20261009184802.png" }, // Ohut
                { color: "Untitled311_20261009184807.png", outline: "Untitled311_20261009184812.png" }  // Paksu
            ],
            face: [
                { color: "Untitled311_20261009184821.png", outline: "Untitled311_20261009184825.png" }, // Naama 1
                { color: "Untitled311_20261009184831.png", outline: "Untitled311_20261009184835.png" }  // Naama 2
            ]
        };

        let currentGenotype = "";

        // Väri-synkkaukset
        document.getElementById("isa_eyes").addEventListener("input", (e) => { document.getElementById("isa_eyes_hex").value = e.target.value.toUpperCase(); });
        document.getElementById("isa_eyes_hex").addEventListener("input", (e) => { if (/^#[0-9A-F]{6}$/i.test(e.target.value)) document.getElementById("isa_eyes").value = e.target.value; });
        document.getElementById("ema_eyes").addEventListener("input", (e) => { document.getElementById("ema_eyes_hex").value = e.target.value.toUpperCase(); });
        document.getElementById("ema_eyes_hex").addEventListener("input", (e) => { if (/^#[0-9A-F]{6}$/i.test(e.target.value)) document.getElementById("ema_eyes").value = e.target.value; });

        document.getElementById("isa_skin").addEventListener("input", (e) => { document.getElementById("isa_skin_hex").value = e.target.value.toUpperCase(); });
        document.getElementById("isa_skin_hex").addEventListener("input", (e) => { if (/^#[0-9A-F]{6}$/i.test(e.target.value)) document.getElementById("isa_skin").value = e.target.value; });
        document.getElementById("ema_skin").addEventListener("input", (e) => { document.getElementById("ema_skin_hex").value = e.target.value.toUpperCase(); });
        document.getElementById("ema_skin_hex").addEventListener("input", (e) => { if (/^#[0-9A-F]{6}$/i.test(e.target.value)) document.getElementById("ema_skin").value = e.target.value; });

        function hexToRgb(hex) {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? { r: parseInt(result[1], 16), g: parseInt(result[2], 16), b: parseInt(result[3], 16) } : { r: 139, g: 69, b: 19 };
        }

        function rgbToHex(r, g, b) {
            return "#" + [r, g, b].map(x => Math.max(0, Math.min(255, x)).toString(16).padStart(2, "0")).join("").toUpperCase();
        }

        function blendColors(color1, color2) {
            const rgb1 = hexToRgb(color1);
            const rgb2 = hexToRgb(color2);
            return rgbToHex(Math.round((rgb1.r + rgb2.r) / 2), Math.round((rgb1.g + rgb2.g) / 2), Math.round((rgb1.b + rgb2.b) / 2));
        }

        function randomizeColor(color1, color2) {
            const rand = Math.random();
            if (rand < 0.35) return color1;
            if (rand < 0.7) return color2;
            return blendColors(color1, color2);
        }

        function arvoAlleeli(genotyyppi) {
            let alleelit = [];
            if (genotyyppi === "BB") alleelit = ["B", "B"];
            else if (genotyyppi === "Bb") alleelit = ["B", "b"];
            else if (genotyyppi === "Bb1") alleelit = ["B", "b1"];
            else if (genotyyppi === "bb") alleelit = ["b", "b"];
            else if (genotyyppi === "bb1") alleelit = ["b", "b1"];
            else if (genotyyppi === "b1b1") alleelit = ["b1", "b1"];
            else if (genotyyppi === "AA") alleelit = ["A", "A"];
            else if (genotyyppi === "Aa") alleelit = ["A", "a"];
            else if (genotyyppi === "Aa1") alleelit = ["A", "a1"];
            else if (genotyyppi === "aa") alleelit = ["a", "a"];
            else if (genotyyppi === "aa1") alleelit = ["a", "a1"];
            else if (genotyyppi === "a1a1") alleelit = ["a1", "a1"];
            else alleelit = [genotyyppi[0], genotyyppi[1]];

            return alleelit[Math.floor(Math.random() * 2)];
        }

        function luoGenotyyppi(g1, g2, tyyppi = "normaali") {
            let a1 = arvoAlleeli(g1);
            let a2 = arvoAlleeli(g2);

            if (tyyppi === "B") {
                const arvo = (a) => (a === "B" ? 3 : a === "b" ? 2 : 1);
                return [a1, a2].sort((a, b) => arvo(b) - arvo(a)).join("");
            }
            if (tyyppi === "A") {
                const arvo = (a) => (a === "A" ? 3 : a === "a" ? 2 : 1);
                return [a1, a2].sort((a, b) => arvo(b) - arvo(a)).join("");
            }

            return [a1, a2].sort().join("");
        }

        function varioiHSL(h, s, l) {
            let dH = h + (Math.random() * 10 - 5);
            let dS = Math.max(0, Math.min(100, s + (Math.random() * 10 - 5)));
            let dL = Math.max(0, Math.min(100, l + (Math.random() * 12 - 6)));
            return `hsl(${dH}, ${dS}%, ${dL}%)`;
        }

        function piirraCalicoLaikut(ctx, width, height, vari, maara = 10) {
            ctx.fillStyle = vari;
            for (let i = 0; i < maara; i++) {
                let keskiX = Math.random() * width;
                let keskiY = Math.random() * height;
                let perussade = 50 + Math.random() * 80; 
                let pisteita = 8 + Math.floor(Math.random() * 6);

                let pisteet = [];
                for (let j = 0; j < pisteita; j++) {
                    let kulma = (j / pisteita) * Math.PI * 2;
                    let sädevaihtelu = perussade * (0.6 + Math.random() * 0.8);
                    pisteet.push({ x: keskiX + Math.cos(kulma) * sädevaihtelu, y: keskiY + Math.sin(kulma) * sädevaihtelu });
                }

                ctx.beginPath();
                let alkukeksiX = (pisteet[0].x + pisteet[pisteita - 1].x) / 2;
                let alkukeksiY = (pisteet[0].y + pisteet[pisteita - 1].y) / 2;
                ctx.moveTo(alkukeksiX, alkukeksiY);

                for (let j = 0; j < pisteita; j++) {
                    let nykyinen = pisteet[j];
                    let seuraava = pisteet[(j + 1) % pisteita];
                    ctx.quadraticCurveTo(nykyinen.x, nykyinen.y, (nykyinen.x + seuraava.x) / 2, (nykyinen.y + seuraava.y) / 2);
                }
                ctx.closePath();
                ctx.fill();
            }
        }

        function piirraGradient(ctx, width, height) {
            ctx.save();
            let grad = ctx.createLinearGradient(Math.random() * width, Math.random() * height, Math.random() * width, Math.random() * height);
            if (Math.random() < 0.5) {
                grad.addColorStop(0, "rgba(0, 0, 0, 0.4)");
                grad.addColorStop(1, "rgba(0, 0, 0, 0.0)");
            } else {
                grad.addColorStop(0, "rgba(255, 255, 255, 0.45)");
                grad.addColorStop(1, "rgba(255, 255, 255, 0.0)");
            }
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);
            ctx.restore();
        }

        function arvoPentu() {
            let pentuM = luoGenotyyppi(document.getElementById("isa_m").value, document.getElementById("ema_m").value);
            let pentuS = luoGenotyyppi(document.getElementById("isa_s").value, document.getElementById("ema_s").value);
            let pentuC = luoGenotyyppi(document.getElementById("isa_c").value, document.getElementById("ema_c").value);
            let pentuB = luoGenotyyppi(document.getElementById("isa_b").value, document.getElementById("ema_b").value, "B");
            let pentuH = luoGenotyyppi(document.getElementById("isa_h").value, document.getElementById("ema_h").value);
            let pentuO = luoGenotyyppi(document.getElementById("isa_o").value, document.getElementById("ema_o").value);
            let pentuN = luoGenotyyppi(document.getElementById("isa_n").value, document.getElementById("ema_n").value);
            let pentuG = luoGenotyyppi(document.getElementById("isa_g").value, document.getElementById("ema_g").value);
            let pentuA = luoGenotyyppi(document.getElementById("isa_a").value, document.getElementById("ema_a").value, "A");
            let pentuR = luoGenotyyppi(document.getElementById("isa_r").value, document.getElementById("ema_r").value);
            let pentuV = luoGenotyyppi(document.getElementById("isa_v").value, document.getElementById("ema_v").value);

            let pentuEyeColor = randomizeColor(document.getElementById("isa_eyes").value.toUpperCase(), document.getElementById("ema_eyes").value.toUpperCase());
            let pentuSkinColor = randomizeColor(document.getElementById("isa_skin").value.toUpperCase(), document.getElementById("ema_skin").value.toUpperCase());
            let pentuNose = Math.random() < 0.5 ? document.getElementById("isa_nose").value : document.getElementById("ema_nose").value;

            currentGenotype = `${pentuM}_${pentuS}_${pentuC}_${pentuB}_${pentuH}_${pentuO}_${pentuN}_${pentuG}_${pentuA}_${pentuR}_${pentuV}`;

            let valkoistenMaara = pentuS === "SS" ? 18 : pentuS.includes("S") ? 6 : 0;
            let onkoHarja = pentuM.includes("M");
            let onkoKihara = (pentuC === "cc");
            let onkoGradient = (pentuG === "gg");

            // Värit
            let tummaHSL = pentuB.includes("B") ? { h: 30, s: 5, l: 18 } : (pentuB === "bb" || pentuB === "bb1") ? { h: 25, s: 40, l: 25 } : { h: 20, s: 50, l: 40 };
            let harjaHSL = (pentuH.includes("H") && pentuH.includes("h")) ? { h: 25, s: 35, l: 25 } : (pentuH === "HH") ? { h: 30, s: 5, l: 15 } : { h: 35, s: 60, l: 70 };
            let punainenHSL = pentuO === "oo" ? { h: 38, s: 55, l: 78 } : { h: 20, s: 80, l: 50 };

            let variTumma = varioiHSL(tummaHSL.h, tummaHSL.s, tummaHSL.l);
            let variPunainen = varioiHSL(punainenHSL.h, punainenHSL.s, punainenHSL.l);
            let variHarja = varioiHSL(harjaHSL.h, harjaHSL.s, harjaHSL.l);

            let paavari = pentuN === "NN" ? variTumma : pentuN === "nn" ? variPunainen : (Math.random() < 0.5 ? variPunainen : variTumma);

            // Määritetään raitojen esiintyvyys (A-geenin ja R-geenin mukaan)
            let onkoRaitoja = pentuR.includes("R");
            let raitaLimbs = false, raitaBody = false, raitaFace = false;

            if (onkoRaitoja) {
                if (pentuA.includes("A")) {
                    // Kaikkialla
                    raitaLimbs = true; raitaBody = true; raitaFace = true;
                } else if (pentuA === "aa" || pentuA === "aa1") {
                    // Vain raajat ja naama
                    raitaLimbs = true; raitaFace = true;
                } else if (pentuA === "a1a1") {
                    // Vain keho
                    raitaBody = true;
                }
            }

            let onkoVarjo = (pentuV === "vv"); // vv = vaalea läpinäkyvä keskusta

            document.getElementById("tulos").innerText = 
                `Genotyyppi: ${currentGenotype}\n` +
                `Silmät: ${pentuEyeColor} | Nahka: ${pentuSkinColor} | Nenä: ${pentuNose}\n` +
                `Raidat: ${onkoRaitoja ? (onkoVarjo ? "Vaalennetut raidat (vv)" : "Normaalit raidat") : "Ei raitoja"}`;

            piirraErillinenHarjaPentu({
                pohja: onkoKihara ? "Untitled309_20261008214953.png" : "Untitled309_20261008214944.png",
                pohjaHarja: onkoHarja ? (onkoKihara ? "Untitled309_20261008151613.png" : "Untitled309_20261008151605.png") : null,
                viiva: onkoKihara ? "Untitled309_20261008153435.png" : "Untitled309_20261008153442.png",
                viivaHarja: onkoHarja ? (onkoKihara ? "Untitled309_20261008153420.png" : "Untitled309_20261008153429.png") : null,
                kehoVari: paavari,
                harjaVari: variHarja,
                valkoistenMaara: valkoistenMaara,
                onkoGradient: onkoGradient,
                eyeColor: pentuEyeColor,
                eyeLineart: eyeLinearts[Math.floor(Math.random() * eyeLinearts.length)],
                skinColor: pentuSkinColor,
                noseSkin: noseData[pentuNose].skin,
                noseViiva: noseData[pentuNose].lineart,
                mouthLineart: mouthLinearts[Math.floor(Math.random() * mouthLinearts.length)],
                earsAndPawsSkin: earsAndPawsSkinFile,
                // Raitatiedot
                raitaLimbs: raitaLimbs,
                raitaBody: raitaBody,
                raitaFace: raitaFace,
                onkoVarjo: onkoVarjo
            });
        }

        function lataaKuva(url) {
            return new Promise((resolve) => {
                if (!url) return resolve(null);
                const img = new Image();
                img.onload = () => resolve(img);
                img.onerror = () => resolve(null);
                img.src = url;
            });
        }

        async function piirraErillinenHarjaPentu(opts) {
            const canvas = document.getElementById("canvas");
            const ctx = canvas.getContext("2d");
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Arotaan käytettävät raitatyylit
            const selectedLimbsStripe = stripeAssets.limbs[Math.floor(Math.random() * stripeAssets.limbs.length)];
            const selectedBodyStripe = stripeAssets.body[Math.floor(Math.random() * stripeAssets.body.length)];
            const selectedFaceStripe = stripeAssets.face[Math.floor(Math.random() * stripeAssets.face.length)];

            const [
                imgPohja, imgPohjaHarja, imgViiva, imgViivaHarja, 
                imgSilmät, imgSilmätLineArt, imgNoseSkin, imgNoseViiva, 
                imgMouthLineart, imgEarsAndPawsSkin,
                // Raita-kuvat
                imgLimbsColor, imgLimbsOutline,
                imgBodyColor, imgBodyOutline,
                imgFaceColor, imgFaceOutline
            ] = await Promise.all([
                lataaKuva(opts.pohja),
                lataaKuva(opts.pohjaHarja),
                lataaKuva(opts.viiva),
                lataaKuva(opts.viivaHarja),
                lataaKuva("Untitled309_20261008221009.png"),
                lataaKuva(opts.eyeLineart),
                lataaKuva(opts.noseSkin),
                lataaKuva(opts.noseViiva),
                lataaKuva(opts.mouthLineart),
                lataaKuva(opts.earsAndPawsSkin),
                // Raita-lataukset
                opts.raitaLimbs ? lataaKuva(selectedLimbsStripe.color) : null,
                opts.raitaLimbs ? lataaKuva(selectedLimbsStripe.outline) : null,
                opts.raitaBody ? lataaKuva(selectedBodyStripe.color) : null,
                opts.raitaBody ? lataaKuva(selectedBodyStripe.outline) : null,
                opts.raitaFace ? lataaKuva(selectedFaceStripe.color) : null,
                opts.raitaFace ? lataaKuva(selectedFaceStripe.outline) : null
            ]);

            // VAIHE 1: KEHO (Pohjaväri + Gradient + Valkoinen)
            if (imgPohja) {
                ctx.globalCompositeOperation = "source-over";
                ctx.drawImage(imgPohja, 0, 0, canvas.width, canvas.height);

                ctx.globalCompositeOperation = "source-in";
                ctx.fillStyle = opts.kehoVari;
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                if (opts.onkoGradient) {
                    ctx.globalCompositeOperation = "source-atop";
                    piirraGradient(ctx, canvas.width, canvas.height);
                }

                if (opts.valkoistenMaara > 0) {
                    ctx.globalCompositeOperation = "source-atop";
                    piirraCalicoLaikut(ctx, canvas.width, canvas.height, "#ffffff", opts.valkoistenMaara);
                }
            }

            // VAIHE 1.5: RAIDAT (Piirretään turkin päälle ennen kehon ääriviivoja)
            const centerOpacity = opts.onkoVarjo ? 0.30 : 0.85; // vv = 30% läpikuultava

            function piirraRaitaKerros(imgColor, imgOutline) {
                if (!imgColor || !imgOutline) return;

                // 1. Keskiosa (läpikuultava V-geenin mukaan)
                const tempColorCanvas = document.createElement("canvas");
                tempColorCanvas.width = canvas.width; tempColorCanvas.height = canvas.height;
                const tempColorCtx = tempColorCanvas.getContext("2d");

                tempColorCtx.drawImage(imgColor, 0, 0, canvas.width, canvas.height);
                tempColorCtx.globalCompositeOperation = "source-in";
                tempColorCtx.fillStyle = "#1a0d00"; // Tumma raitaväri
                tempColorCtx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.save();
                ctx.globalCompositeOperation = "source-over";
                ctx.globalAlpha = centerOpacity;
                ctx.drawImage(tempColorCanvas, 0, 0);
                ctx.restore();

                // 2. Ääriviiva (aina peittävämpänä päälle)
                const tempOutlineCanvas = document.createElement("canvas");
                tempOutlineCanvas.width = canvas.width; tempOutlineCanvas.height = canvas.height;
                const tempOutlineCtx = tempOutlineCanvas.getContext("2d");

                tempOutlineCtx.drawImage(imgOutline, 0, 0, canvas.width, canvas.height);
                tempOutlineCtx.globalCompositeOperation = "source-in";
                tempOutlineCtx.fillStyle = "#000000"; // Piki-musta reuna
                tempOutlineCtx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.save();
                ctx.globalCompositeOperation = "source-over";
                ctx.globalAlpha = 0.90;
                ctx.drawImage(tempOutlineCanvas, 0, 0);
                ctx.restore();
            }

            // Piirretään aktiiviset raidat
            if (opts.raitaLimbs) piirraRaitaKerros(imgLimbsColor, imgLimbsOutline);
            if (opts.raitaBody) piirraRaitaKerros(imgBodyColor, imgBodyOutline);
            if (opts.raitaFace) piirraRaitaKerros(imgFaceColor, imgFaceOutline);

            // VAIHE 2: KEHON ÄÄRIVIIVAT
            ctx.globalCompositeOperation = "source-over";
            if (imgViiva) ctx.drawImage(imgViiva, 0, 0, canvas.width, canvas.height);

            // VAIHE 3 & 4: HARJA
            if (imgPohjaHarja) {
                const tempCanvas = document.createElement("canvas");
                tempCanvas.width = canvas.width; tempCanvas.height = canvas.height;
                const tempCtx = tempCanvas.getContext("2d");

                tempCtx.drawImage(imgPohjaHarja, 0, 0, canvas.width, canvas.height);
                tempCtx.globalCompositeOperation = "source-in";
                tempCtx.fillStyle = opts.harjaVari;
                tempCtx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.globalCompositeOperation = "source-over";
                ctx.drawImage(tempCanvas, 0, 0);
            }
            if (imgViivaHarja) ctx.drawImage(imgViivaHarja, 0, 0, canvas.width, canvas.height);

            // VAIHE 5 & 6: SILMÄT
            if (imgSilmät) {
                const tempEyeCanvas = document.createElement("canvas");
                tempEyeCanvas.width = canvas.width; tempEyeCanvas.height = canvas.height;
                const tempEyeCtx = tempEyeCanvas.getContext("2d");

                tempEyeCtx.drawImage(imgSilmät, 0, 0, canvas.width, canvas.height);
                tempEyeCtx.globalCompositeOperation = "source-in";
                tempEyeCtx.fillStyle = opts.eyeColor;
                tempEyeCtx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.globalCompositeOperation = "source-over";
                ctx.drawImage(tempEyeCanvas, 0, 0);
            }
            if (imgSilmätLineArt) ctx.drawImage(imgSilmätLineArt, 0, 0, canvas.width, canvas.height);

            // VAIHE 7: NAHKA
            if (imgNoseSkin || imgEarsAndPawsSkin) {
                const tempSkinCanvas = document.createElement("canvas");
                tempSkinCanvas.width = canvas.width; tempSkinCanvas.height = canvas.height;
                const tempSkinCtx = tempSkinCanvas.getContext("2d");

                if (imgEarsAndPawsSkin) tempSkinCtx.drawImage(imgEarsAndPawsSkin, 0, 0, canvas.width, canvas.height);
                if (imgNoseSkin) tempSkinCtx.drawImage(imgNoseSkin, 0, 0, canvas.width, canvas.height);

                tempSkinCtx.globalCompositeOperation = "source-in";
                tempSkinCtx.fillStyle = opts.skinColor;
                tempSkinCtx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.globalCompositeOperation = "source-over";
                ctx.drawImage(tempSkinCanvas, 0, 0);
            }

            // VAIHE 8 & 9: NENÄ JA SUU LINEART
            if (imgNoseViiva) ctx.drawImage(imgNoseViiva, 0, 0, canvas.width, canvas.height);
            if (imgMouthLineart) ctx.drawImage(imgMouthLineart, 0, 0, canvas.width, canvas.height);
        }

        function lataaKuvaLaitteelle() {
            const canvas = document.getElementById("canvas");
            const latausLinkki = document.createElement("a");
            latausLinkki.download = `${currentGenotype}.png`;
            latausLinkki.href = canvas.toDataURL("image/png");
            document.body.appendChild(latausLinkki);
            latausLinkki.click();
            document.body.removeChild(latausLinkki);
        }
    </script>
