<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 15px;
            max-width: 580px;
            margin: auto;
            background-color: #f4f4f9;
        }
        .card {
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 15px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            gap: 4px;
        }
        .grid-2 {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }
        label {
            font-size: 9px;
            font-weight: bold;
            display: block;
            margin-bottom: 2px;
            text-align: center;
        }
        select {
            width: 100%;
            padding: 5px 0px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 10px;
        }
        input[type="color"] {
            width: 100%;
            height: 40px;
            border: 1px solid #ccc;
            border-radius: 6px;
            cursor: pointer;
        }
        input[type="text"] {
            width: 100%;
            padding: 6px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 10px;
            font-family: monospace;
        }
        .color-input-group {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .color-input-group input[type="color"] {
            flex: 0 0 50px;
            height: 35px;
            width: 50px;
        }
        .color-input-group input[type="text"] {
            flex: 1;
        }
        button {
            width: 100%;
            background-color: #007aff;
            color: white;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 12px;
            padding: 12px;
            font-size: 15px;
        }
        .btn-download {
            background-color: #34c759;
            margin-top: 8px;
        }
        #canvas {
            width: 100%;
            height: auto;
            border-radius: 8px;
            background: #fff;
            display: block;
        }
        .tulos {
            margin-top: 10px;
            font-weight: bold;
            text-align: center;
            font-size: 13px;
            line-height: 1.4;
            white-space: pre-wrap;
        }

</head>

    <script>
        // Eye lineart variations
        const eyeLinearts = [
            "Untitled309_20261009091214.png",
            "Untitled309_20261009091209.png",
            "Untitled309_20261009091204.png",
            "Untitled309_20261008221019.png",
            "Untitled309_20261008221015.png"
        ];

        // Mouth lineart variations (lineart only, no colors)
        const mouthLinearts = [
            "Untitled309_20261009102847.png",
            "Untitled309_20261009102854.png",
            "Untitled309_20261009102859.png",
            "Untitled309_20261009103005.png",
            "Untitled309_20261009103224.png",
            "Untitled309_20261009103305.png"
        ];

        // Nose data
        const noseData = {
            smooth: {
                lineart: "Untitled309_20261008153420.png",
                color: "Untitled309_20261008153420.png"
            },
            big: {
                lineart: "Untitled309_20261008153420.png",
                color: "Untitled309_20261008153420.png"
            },
            sharp: {
                lineart: "Untitled309_20261008153420.png",
                color: "Untitled309_20261008153420.png"
            }
        };

        // Color sync functionality
        document.getElementById("isa_eyes").addEventListener("input", (e) => {
            document.getElementById("isa_eyes_hex").value = e.target.value.toUpperCase();
        });
        document.getElementById("isa_eyes_hex").addEventListener("input", (e) => {
            if (/^#[0-9A-F]{6}$/i.test(e.target.value)) {
                document.getElementById("isa_eyes").value = e.target.value;
            }
        });

        document.getElementById("ema_eyes").addEventListener("input", (e) => {
            document.getElementById("ema_eyes_hex").value = e.target.value.toUpperCase();
        });
        document.getElementById("ema_eyes_hex").addEventListener("input", (e) => {
            if (/^#[0-9A-F]{6}$/i.test(e.target.value)) {
                document.getElementById("ema_eyes").value = e.target.value;
            }
        });

        document.getElementById("isa_skin").addEventListener("input", (e) => {
            document.getElementById("isa_skin_hex").value = e.target.value.toUpperCase();
        });
        document.getElementById("isa_skin_hex").addEventListener("input", (e) => {
            if (/^#[0-9A-F]{6}$/i.test(e.target.value)) {
                document.getElementById("isa_skin").value = e.target.value;
            }
        });

        document.getElementById("ema_skin").addEventListener("input", (e) => {
            document.getElementById("ema_skin_hex").value = e.target.value.toUpperCase();
        });
        document.getElementById("ema_skin_hex").addEventListener("input", (e) => {
            if (/^#[0-9A-F]{6}$/i.test(e.target.value)) {
                document.getElementById("ema_skin").value = e.target.value;
            }
        });

        function hexToRgb(hex) {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? {
                r: parseInt(result[1], 16),
                g: parseInt(result[2], 16),
                b: parseInt(result[3], 16)
            } : { r: 139, g: 69, b: 19 };
        }

        function rgbToHex(r, g, b) {
            return "#" + [r, g, b].map(x => {
                const hex = x.toString(16);
                return hex.length === 1 ? "0" + hex : hex;
            }).join("").toUpperCase();
        }

        function blendColors(color1, color2) {
            const rgb1 = hexToRgb(color1);
            const rgb2 = hexToRgb(color2);
            const blendedR = Math.round((rgb1.r + rgb2.r) / 2);
            const blendedG = Math.round((rgb1.g + rgb2.g) / 2);
            const blendedB = Math.round((rgb1.b + rgb2.b) / 2);
            return rgbToHex(blendedR, blendedG, blendedB);
        }

        function randomizeColor(color1, color2) {
            // Randomly choose one of the parent colors or a blend
            const rand = Math.random();
            if (rand < 0.35) {
                return color1;
            } else if (rand < 0.7) {
                return color2;
            } else {
                return blendColors(color1, color2);
            }
        }

        function getRandomEyeLineart() {
            return eyeLinearts[Math.floor(Math.random() * eyeLinearts.length)];
        }

        function getRandomMouthLineart() {
            return mouthLinearts[Math.floor(Math.random() * mouthLinearts.length)];
        }

        function arvoAlleeli(genotyyppi) {
            let alleelit = [];
            if (genotyyppi === "BB") alleelit = ["B", "B"];
            else if (genotyyppi === "Bb") alleelit = ["B", "b"];
            else if (genotyyppi === "Bb1") alleelit = ["B", "b1"];
            else if (genotyyppi === "bb") alleelit = ["b", "b"];
            else if (genotyyppi === "bb1") alleelit = ["b", "b1"];
            else if (genotyyppi === "b1b1") alleelit = ["b1", "b1"];
            else alleelit = [genotyyppi[0], genotyyppi[1]];

            return alleelit[Math.floor(Math.random() * 2)];
        }

        function luoGenotyyppi(g1, g2, onkoBGeeni = false) {
            let a1 = arvoAlleeli(g1);
            let a2 = arvoAlleeli(g2);

            if (onkoBGeeni) {
                const arvo = (a) => (a === "B" ? 3 : a === "b" ? 2 : 1);
                let lista = [a1, a2].sort((a, b) => arvo(b) - arvo(a));
                return lista.join("");
            }

            return [a1, a2].sort().join("");
        }

        function varioiHSL(h, s, l) {
            let dH = h + (Math.random() * 10 - 5);
            let dS = Math.max(0, Math.min(100, s + (Math.random() * 10 - 5)));
            let dL = Math.max(0, Math.min(100, l + (Math.random() * 12 - 6)));
            return `hsl(${dH}, ${dS}%, ${dL}%)`;
        }

        function piirraCalicoLaikut(ctx, width, height, vari, maara = 10) {
            ctx.fillStyle = vari;

            for (let i = 0; i < maara; i++) {
                let keskiX = Math.random() * width;
                let keskiY = Math.random() * height;
                let perussade = 50 + Math.random() * 80; 
                let pisteita = 8 + Math.floor(Math.random() * 6);

                let pisteet = [];
                for (let j = 0; j < pisteita; j++) {
                    let kulma = (j / pisteita) * Math.PI * 2;
                    let sädevaihtelu = perussade * (0.6 + Math.random() * 0.8);
                    pisteet.push({
                        x: keskiX + Math.cos(kulma) * sädevaihtelu,
                        y: keskiY + Math.sin(kulma) * sädevaihtelu
                    });
                }

                ctx.beginPath();
                let alkukeksiX = (pisteet[0].x + pisteet[pisteita - 1].x) / 2;
                let alkukeksiY = (pisteet[0].y + pisteet[pisteita - 1].y) / 2;
                ctx.moveTo(alkukeksiX, alkukeksiY);

                for (let j = 0; j < pisteita; j++) {
                    let nykyinen = pisteet[j];
                    let seuraava = pisteet[(j + 1) % pisteita];
                    let keskiSeuraavaX = (nykyinen.x + seuraava.x) / 2;
                    let keskiSeuraavaY = (nykyinen.y + seuraava.y) / 2;

                    ctx.quadraticCurveTo(nykyinen.x, nykyinen.y, keskiSeuraavaX, keskiSeuraavaY);
                }

                ctx.closePath();
                ctx.fill();
            }
        }

        // --- BRINDLE-RAITOJEN PIIRTO ---
        function piirraBrindleRaidat(ctx, width, height) {
            ctx.save();
            // Raitojen opasiteetti 40% - 100%
            ctx.globalAlpha = 0.4 + Math.random() * 0.6;
            ctx.fillStyle = "#000000";

            let raitojenMaara = 25 + Math.floor(Math.random() * 20);
            for (let i = 0; i < raitojenMaara; i++) {
                let x = Math.random() * width;
                let y = Math.random() * height;
                let pituus = 150 + Math.random() * 300;
                let paksuus = 8 + Math.random() * 20;

                ctx.beginPath();
                ctx.moveTo(x, y);
                // Käännetään raitoja pystypainotteisesti pienen aaltoilun kera
                ctx.bezierCurveTo(
                    x + (Math.random() * 40 - 20), y + pituus * 0.3,
                    x + (Math.random() * 60 - 30), y + pituus * 0.7,
                    x + (Math.random() * 20 - 10), y + pituus
                );
                ctx.lineWidth = paksuus;
                ctx.strokeStyle = "#000000";
                ctx.lineCap = "round";
                ctx.stroke();
            }
            ctx.restore();
        }

        // --- GRADIENTIN PIIRTO ---
        function piirraGradient(ctx, width, height) {
            ctx.save();
            // Satunnainen kulma/suunta gradientille
            let x1 = Math.random() * width;
            let y1 = Math.random() * height;
            let x2 = Math.random() * width;
            let y2 = Math.random() * height;

            let grad = ctx.createLinearGradient(x1, y1, x2, y2);
            
            // Arvotaan onko liukuväri tummentava vaiko vaalentava
            if (Math.random() < 0.5) {
                grad.addColorStop(0, "rgba(0, 0, 0, 0.4)");
                grad.addColorStop(1, "rgba(0, 0, 0, 0.0)");
            } else {
                grad.addColorStop(0, "rgba(255, 255, 255, 0.45)");
                grad.addColorStop(1, "rgba(255, 255, 255, 0.0)");
            }

            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);
            ctx.restore();
        }

        function arvoPentu() {
            // 1. Lue valikot
            let isaM = document.getElementById("isa_m").value;
            let isaS = document.getElementById("isa_s").value;
            let isaC = document.getElementById("isa_c").value;
            let isaB = document.getElementById("isa_b").value;
            let isaH = document.getElementById("isa_h").value;
            let isaO = document.getElementById("isa_o").value;
            let isaN = document.getElementById("isa_n").value;
            let isaT = document.getElementById("isa_t").value;
            let isaG = document.getElementById("isa_g").value;
            let isaNose = document.getElementById("isa_nose").value;

            let emaM = document.getElementById("ema_m").value;
            let emaS = document.getElementById("ema_s").value;
            let emaC = document.getElementById("ema_c").value;
            let emaB = document.getElementById("ema_b").value;
            let emaH = document.getElementById("ema_h").value;
            let emaO = document.getElementById("ema_o").value;
            let emaN = document.getElementById("ema_n").value;
            let emaT = document.getElementById("ema_t").value;
            let emaG = document.getElementById("ema_g").value;
            let emaNose = document.getElementById("ema_nose").value;

            // Eye colors - now randomized
            let isaEyeColor = document.getElementById("isa_eyes").value.toUpperCase();
            let emaEyeColor = document.getElementById("ema_eyes").value.toUpperCase();
            let pentuEyeColor = randomizeColor(isaEyeColor, emaEyeColor);
            let selectedEyeLineart = getRandomEyeLineart();

            // Skin colors - now randomized
            let isaSkinColor = document.getElementById("isa_skin").value.toUpperCase();
            let emaSkinColor = document.getElementById("ema_skin").value.toUpperCase();
            let pentuSkinColor = randomizeColor(isaSkinColor, emaSkinColor);

            // Mouth lineart - randomized
            let selectedMouthLineart = getRandomMouthLineart();

            // Nose - 50/50 inheritance
            let pentuNose = Math.random() < 0.5 ? isaNose : emaNose;

            // 2. Arvo pennun genotyypit
            let pentuM = luoGenotyyppi(isaM, emaM);
            let pentuS = luoGenotyyppi(isaS, emaS);
            let pentuC = luoGenotyyppi(isaC, emaC);
            let pentuB = luoGenotyyppi(isaB, emaB, true);
            let pentuH = luoGenotyyppi(isaH, emaH);
            let pentuO = luoGenotyyppi(isaO, emaO);
            let pentuN = luoGenotyyppi(isaN, emaN);
            let pentuT = luoGenotyyppi(isaT, emaT);
            let pentuG = luoGenotyyppi(isaG, emaG);

            // Valkoisten laikkujen määrä
            let valkoistenMaara = 0;
            if (pentuS === "SS") valkoistenMaara = 18;
            else if (pentuS.includes("S")) valkoistenMaara = 6;

            // Ominaisuudet
            let onkoHarja = pentuM.includes("M");
            let onkoKihara = (pentuC === "cc");
            let onkoBrindle = pentuT.includes("T");
            let onkoGradient = (pentuG === "gg");

            // 3. Määritä fenotyypit
            let tummaHSL, tummaNimi;
            if (pentuB.includes("B")) {
                tummaHSL = { h: 30, s: 5, l: 18 };
                tummaNimi = "Musta";
            } else if (pentuB === "bb" || pentuB === "bb1") {
                tummaHSL = { h: 25, s: 40, l: 25 };
                tummaNimi = "Ruskea";
            } else { // b1b1
                tummaHSL = { h: 20, s: 50, l: 40 };
                tummaNimi = "Kaneli";
            }

            let harjaHSL, harjaNimi;
            if (pentuH.includes("H") && pentuH.includes("h")) {
                harjaHSL = { h: 25, s: 35, l: 25 };
                harjaNimi = "Ruskea harja";
            } else if (pentuH === "HH") {
                harjaHSL = { h: 30, s: 5, l: 15 };
                harjaNimi = "Musta harja";
            } else {
                harjaHSL = { h: 35, s: 60, l: 70 };
                harjaNimi = "Vaalea harja";
            }

            // OO/Oo = Punainen, oo = Kermankeltainen (Dilute punainen)
            let punainenHSL, punainenNimi;
            if (pentuO === "oo") {
                punainenHSL = { h: 38, s: 55, l: 78 };
                punainenNimi = "Kermankeltainen";
            } else {
                punainenHSL = { h: 20, s: 80, l: 50 };
                punainenNimi = "Punainen";
            }

            let variTumma = varioiHSL(tummaHSL.h, tummaHSL.s, tummaHSL.l);
            let variPunainen = varioiHSL(punainenHSL.h, punainenHSL.s, punainenHSL.l);
            let variHarja = varioiHSL(harjaHSL.h, harjaHSL.s, harjaHSL.l);

            let paavari = "";
            let laikkavari = null;
            let kehoTeksti = "";

            if (pentuN === "NN") {
                paavari = variTumma;
                kehoTeksti = tummaNimi;
            } else if (pentuN === "nn") {
                paavari = variPunainen;
                kehoTeksti = punainenNimi;
            } else {
                if (Math.random() < 0.5) {
                    paavari = variPunainen;
                    laikkavari = variTumma;
                } else {
                    paavari = variTumma;
                    laikkavari = variPunainen;
                }
                kehoTeksti = `Kilpikonnakuvio (${tummaNimi} / ${punainenNimi})`;
            }

            if (onkoBrindle) {
                kehoTeksti += " + Brindle";
            }
            if (onkoGradient) {
                kehoTeksti += " + Gradient";
            }

            // 4. Kuvatiedostot
            let pohjaTiedosto = onkoKihara 
                ? "Untitled309_20261008214953.png" 
                : "Untitled309_20261008214944.png";

            let pohjaHarjaTiedosto = onkoHarja 
                ? (onkoKihara ? "Untitled309_20261008151613.png" : "Untitled309_20261008151605.png") 
                : null;

            let viivaTiedosto = onkoKihara 
                ? "Untitled309_20261008153435.png" 
                : "Untitled309_20261008153442.png";

            let viivaHarjaTiedosto = onkoHarja 
                ? (onkoKihara ? "Untitled309_20261008153420.png" : "Untitled309_20261008153429.png") 
                : null;

            // Nose files based on inherited nose type
            let noseSkinTiedosto = "";
            let noseViivaaTiedosto = "";
            
            if (pentuNose === "smooth") {
                noseSkinTiedosto = "Untitled309_20261008215650.png";
                noseViivaaTiedosto = "Untitled309_20261008215450.png";
            } else if (pentuNose === "big") {
                noseSkinTiedosto = "Untitled309_20261008220505.png";
                noseViivaaTiedosto = "Untitled309_20261008220001.png";
            } else if (pentuNose === "sharp") {
                noseSkinTiedosto = "Untitled309_20261008221116.png";
                noseViivaaTiedosto = "Untitled309_20261008221011.png";
            }

            // 5. Tekstit
            let harjaTeksti = onkoHarja ? `Harja (${harjaNimi})` : "Ei harjaa";

            document.getElementById("tulos").innerText = 
                `Genotyyppi: ${pentuM} / ${pentuS} / ${pentuC} / ${pentuB} / ${pentuH} / ${pentuO} / ${pentuN} / ${pentuT} / ${pentuG}\n` +
                `Silmien väri: ${pentuEyeColor}\n` +
                `Nahkan väri: ${pentuSkinColor}\n` +
                `Nenä: ${pentuNose}\n` +
                `Ominaisuudet: ${harjaTeksti}, Keho: ${kehoTeksti}`;

            // 6. Piirto
            piirraErillinenHarjaPentu(pohjaTiedosto, pohjaHarjaTiedosto, viivaTiedosto, viivaHarjaTiedosto, paavari, laikkavari, variHarja, valkoistenMaara, onkoBrindle, onkoGradient, pentuEyeColor, selectedEyeLineart, pentuSkinColor, noseSkinTiedosto, noseViivaaTiedosto, selectedMouthLineart);
        }

        function lataaKuva(url) {
            return new Promise((resolve) => {
                if (!url) return resolve(null);
                const img = new Image();
                img.onload = () => resolve(img);
                img.onerror = () => resolve(null);
                img.src = url;
            });
        }

        async function piirraErillinenHarjaPentu(pohja, pohjaHarja, viiva, viivaHarja, kehoVari, laikkavari, harjaVari, valkoistenMaara, onkoBrindle, onkoGradient, eyeColor, eyeLineart, skinColor, noseSkin, noseViiva, mouthLineart) {
            const canvas = document.getElementById("canvas");
            const ctx = canvas.getContext("2d");
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const [imgPohja, imgPohjaHarja, imgViiva, imgViivaHarja, imgSilmät, imgSilmätLineArt, imgNoseSkin, imgNoseViiva, imgMouthLineart] = await Promise.all([
                lataaKuva(pohja),
                lataaKuva(pohjaHarja),
                lataaKuva(viiva),
                lataaKuva(viivaHarja),
                lataaKuva("Untitled309_20261008221009.png"),
                lataaKuva(eyeLineart),
                lataaKuva(noseSkin),
                lataaKuva(noseViiva),
                lataaKuva(mouthLineart)
            ]);

            // VAIHE 1: KEHO (Pohjaväri + Calico-laikut + Brindle + Gradient + Valkoinen)
            if (imgPohja) {
                ctx.globalCompositeOperation = "source-over";
                ctx.drawImage(imgPohja, 0, 0, canvas.width, canvas.height);

                ctx.globalCompositeOperation = "source-in";
                ctx.fillStyle = kehoVari;
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // A) Calico-laikut
                if (laikkavari) {
                    ctx.globalCompositeOperation = "source-atop";
                    piirraCalicoLaikut(ctx, canvas.width, canvas.height, laikkavari, 10);
                }

                // B) Brindle-raidat (Calicon PÄÄLLE)
                if (onkoBrindle) {
                    ctx.globalCompositeOperation = "source-atop";
                    piirraBrindleRaidat(ctx, canvas.width, canvas.height);
                }

                // C) Gradient (Brindlen ja Calicon PÄÄLLE, mutta valkoisen ALLE)
                if (onkoGradient) {
                    ctx.globalCompositeOperation = "source-atop";
                    piirraGradient(ctx, canvas.width, canvas.height);
                }

                // D) Valkoiset laikut (Kaikkien edellisten PÄÄLLE)
                if (valkoistenMaara > 0) {
                    ctx.globalCompositeOperation = "source-atop";
                    piirraCalicoLaikut(ctx, canvas.width, canvas.height, "#ffffff", valkoistenMaara);
                }
            }

            // VAIHE 2: KEHON ÄÄRIVIIVAT
            ctx.globalCompositeOperation = "source-over";
            if (imgViiva) {
                ctx.drawImage(imgViiva, 0, 0, canvas.width, canvas.height);
            }

            // VAIHE 3: HARJAN POHJAVÄRI
            if (imgPohjaHarja) {
                const tempCanvas = document.createElement("canvas");
                tempCanvas.width = canvas.width;
                tempCanvas.height = canvas.height;
                const tempCtx = tempCanvas.getContext("2d");

                tempCtx.drawImage(imgPohjaHarja, 0, 0, canvas.width, canvas.height);
                tempCtx.globalCompositeOperation = "source-in";
                tempCtx.fillStyle = harjaVari;
                tempCtx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.globalCompositeOperation = "source-over";
                ctx.drawImage(tempCanvas, 0, 0);
            }

            // VAIHE 4: HARJAN ÄÄRIVIIVAT
            if (imgViivaHarja) {
                ctx.globalCompositeOperation = "source-over";
                ctx.drawImage(imgViivaHarja, 0, 0, canvas.width, canvas.height);
            }

            // VAIHE 5: NENÄN VÄRI (Nahka)
            if (imgNoseSkin) {
                const tempNoseCanvas = document.createElement("canvas");
                tempNoseCanvas.width = canvas.width;
                tempNoseCanvas.height = canvas.height;
                const tempNoseCtx = tempNoseCanvas.getContext("2d");

                tempNoseCtx.drawImage(imgNoseSkin, 0, 0, canvas.width, canvas.height);
                tempNoseCtx.globalCompositeOperation = "source-in";
                tempNoseCtx.fillStyle = skinColor;
                tempNoseCtx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.globalCompositeOperation = "source-over";
                ctx.drawImage(tempNoseCanvas, 0, 0);
            }

            // VAIHE 6: NENÄN ÄÄRIVIIVAT
            if (imgNoseViiva) {
                ctx.globalCompositeOperation = "source-over";
                ctx.drawImage(imgNoseViiva, 0, 0, canvas.width, canvas.height);
            }

            // VAIHE 7: SILMIEN POHJAVÄRI
            if (imgSilmät) {
                const tempEyeCanvas = document.createElement("canvas");
                tempEyeCanvas.width = canvas.width;
                tempEyeCanvas.height = canvas.height;
                const tempEyeCtx = tempEyeCanvas.getContext("2d");

                tempEyeCtx.drawImage(imgSilmät, 0, 0, canvas.width, canvas.height);
                tempEyeCtx.globalCompositeOperation = "source-in";
                tempEyeCtx.fillStyle = eyeColor;
                tempEyeCtx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.globalCompositeOperation = "source-over";
                ctx.drawImage(tempEyeCanvas, 0, 0);
            }

            // VAIHE 8: SILMIEN LINEART (Randomized on top of eye color)
            if (imgSilmätLineArt) {
                ctx.globalCompositeOperation = "source-over";
                ctx.drawImage(imgSilmätLineArt, 0, 0, canvas.width, canvas.height);
            }

            // VAIHE 9: SUUN LINEART (Randomized, lineart only - no color)
            if (imgMouthLineart) {
                ctx.globalCompositeOperation = "source-over";
                ctx.drawImage(imgMouthLineart, 0, 0, canvas.width, canvas.height);
            }
        }

        function lataaKuvaLaitteelle() {
            const canvas = document.getElementById("canvas");
            const latausLinkki = document.createElement("a");
            latausLinkki.download = "geneticadopt.png";
            latausLinkki.href = canvas.toDataURL("image/png");
            document.body.appendChild(latausLinkki);
            latausLinkki.click();
            document.body.removeChild(latausLinkki);
        }
    </script>
</body>
