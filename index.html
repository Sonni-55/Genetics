<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genetiikkageneraattori</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 15px;
            max-width: 500px;
            margin: auto;
            background-color: #f4f4f9;
        }
        .card {
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 15px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 4px;
        }
        label {
            font-size: 10px;
            font-weight: bold;
            display: block;
            margin-bottom: 2px;
            text-align: center;
        }
        select {
            width: 100%;
            padding: 6px 1px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 11px;
        }
        button {
            width: 100%;
            background-color: #007aff;
            color: white;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 12px;
            padding: 12px;
            font-size: 15px;
        }
        .btn-download {
            background-color: #34c759;
            margin-top: 8px;
        }
        #canvas {
            width: 100%;
            height: auto;
            border-radius: 8px;
            background: #fff;
            display: block;
        }
        .tulos {
            margin-top: 10px;
            font-weight: bold;
            text-align: center;
            font-size: 13px;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Vanhempien geenit</h2>
        
        <h3>Isä</h3>

                <label>M (Harja)</label>
                <select id="isa_m"><option>MM</option><option selected>Mm</option><option>mm</option></select>
            </div>
            <div>
                <label>C (Kihara)</label>
                <select id="isa_c"><option>CC</option><option selected>Cc</option><option>cc</option></select>
            </div>
            <div>
                <label>B (Keho)</label>
                <select id="isa_b">
                    <option value="BB">BB</option>
                    <option value="Bb" selected>Bb</option>
                    <option value="Bb1">Bb1</option>
                    <option value="bb">bb</option>
                    <option value="bb1">bb1</option>
                    <option value="b1b1">b1b1</option>
                </select>
            </div>
            <div>
                <label>H (H.Väri)</label>
                <select id="isa_h"><option>HH</option><option selected>Hh</option><option>hh</option></select>
            </div>
            <div>
                <label>O (Puna)</label>
                <select id="isa_o"><option selected>OO</option><option>Oo</option><option>oo</option></select>
            </div>
