        function hexToRgb(hex) {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? { r: parseInt(result[1], 16), g: parseInt(result[2], 16), b: parseInt(result[3], 16) } : { r: 139, g: 69, b: 19 };
        }

        function rgbToHex(r, g, b) {
            return "#" + [r, g, b].map(x => Math.max(0, Math.min(255, Math.round(x))).toString(16).padStart(2, "0")).join("").toUpperCase();
        }

        function arvoVariVanhemmilta(color1, color2) {
            const rgb1 = hexToRgb(color1);
            const rgb2 = hexToRgb(color2);
            const factor = Math.random(); 
            const r = rgb1.r + factor * (rgb2.r - rgb1.r);
            const g = rgb1.g + factor * (rgb2.g - rgb1.g);
            const b = rgb1.b + factor * (rgb2.b - rgb1.b);
            return rgbToHex(r, g, b);
        }

        function arvoAlleeli(genotyyppi) {
            let alleelit = [];
            if (genotyyppi === "BB") alleelit = ["B", "B"];
            else if (genotyyppi === "Bb") alleelit = ["B", "b"];
            else if (genotyyppi === "Bb1") alleelit = ["B", "b1"];
            else if (genotyyppi === "bb") alleelit = ["b", "b"];
            else if (genotyyppi === "bb1") alleelit = ["b", "b1"];
            else if (genotyyppi === "b1b1") alleelit = ["b1", "b1"];
            else if (genotyyppi === "AA") alleelit = ["A", "A"];
            else if (genotyyppi === "Aa") alleelit = ["A", "a"];
            else if (genotyyppi === "Aa1") alleelit = ["A", "a1"];
            else if (genotyyppi === "aa") alleelit = ["a", "a"];
            else if (genotyyppi === "aa1") alleelit = ["a", "a1"];
            else if (genotyyppi === "a1a1") alleelit = ["a1", "a1"];
            else alleelit = [genotyyppi[0], genotyyppi[1]];

            return alleelit[Math.floor(Math.random() * 2)];
        }

        function luoGenotyyppi(g1, g2, tyyppi = "normaali") {
            let a1 = arvoAlleeli(g1);
            let a2 = arvoAlleeli(g2);

            if (tyyppi === "B") {
                const arvo = (a) => (a === "B" ? 3 : a === "b" ? 2 : 1);
                return [a1, a2].sort((a, b) => arvo(b) - arvo(a)).join("");
            }
            if (tyyppi === "A") {
                const arvo = (a) => (a === "A" ? 3 : a === "a" ? 2 : 1);
                return [a1, a2].sort((a, b) => arvo(b) - arvo(a)).join("");
            }

            return [a1, a2].sort().join("");
        }

        function varioiHSL(h, s, l) {
            let dH = h + (Math.random() * 10 - 5);
            let dS = Math.max(0, Math.min(100, s + (Math.random() * 10 - 5)));
            let dL = Math.max(0, Math.min(100, l + (Math.random() * 12 - 6)));
            return `hsl(${dH}, ${dS}%, ${dL}%)`;
        }

        function piirraCalicoLaikut(ctx, width, height, vari, maara = 6) {
            ctx.fillStyle = vari;
            for (let i = 0; i < maara; i++) {
                let keskiX = Math.random() * width;
                let keskiY = Math.random() * height;
                let perussade = 40 + Math.random() * 60; 
                let pisteita = 8 + Math.floor(Math.random() * 6);

                let pisteet = [];
                for (let j = 0; j < pisteita; j++) {
                    let kulma = (j / pisteita) * Math.PI * 2;
                    let sädevaihtelu = perussade * (0.6 + Math.random() * 0.8);
                    pisteet.push({ x: keskiX + Math.cos(kulma) * sädevaihtelu, y: keskiY + Math.sin(kulma) * sädevaihtelu });
                }

                ctx.beginPath();
                let alkukeksiX = (pisteet[0].x + pisteet[pisteita - 1].x) / 2;
                let alkukeksiY = (pisteet[0].y + pisteet[pisteita - 1].y) / 2;
                ctx.moveTo(alkukeksiX, alkukeksiY);

                for (let j = 0; j < pisteita; j++) {
                    let nykyinen = pisteet[j];
                    let seuraava = pisteet[(j + 1) % pisteita];
                    ctx.quadraticCurveTo(nykyinen.x, nykyinen.y, (nykyinen.x + seuraava.x) / 2, (nykyinen.y + seuraava.y) / 2);
                }
                ctx.closePath();
                ctx.fill();
            }
        }

        function piirraGradient(ctx, width, height) {
            ctx.save();
            let grad = ctx.createLinearGradient(Math.random() * width, Math.random() * height, Math.random() * width, Math.random() * height);
            if (Math.random() < 0.5) {
                grad.addColorStop(0, "rgba(0, 0, 0, 0.4)");
                grad.addColorStop(1, "rgba(0, 0, 0, 0.0)");
            } else {
                grad.addColorStop(0, "rgba(255, 255, 255, 0.45)");
                grad.addColorStop(1, "rgba(255, 255, 255, 0.0)");
            }
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);
            ctx.restore();
        }

            let tummaHSL = onkoDiluutio 
                ? (pentuB.includes("B") ? { h: 210, s: 15, l: 45 } : (pentuB === "bb" || pentuB === "bb1") ? { h: 280, s: 12, l: 50 } : { h: 30, s: 25, l: 65 })
                : (pentuB.includes("B") ? { h: 30, s: 5, l: 18 } : (pentuB === "bb" || pentuB === "bb1") ? { h: 25, s: 40, l: 25 } : { h: 20, s: 50, l: 40 });

            let harjaHSL = (pentuH.includes("H") && pentuH.includes("h")) ? { h: 25, s: 35, l: 25 } : (pentuH === "HH") ? { h: 30, s: 5, l: 15 } : { h: 35, s: 60, l: 70 };
            
            let punainenHSL = pentuO === "oo" 
                ? (onkoDiluutio ? { h: 42, s: 45, l: 85 } : { h: 38, s: 55, l: 78 })
                : (onkoDiluutio ? { h: 30, s: 60, l: 70 } : { h: 20, s: 80, l: 50 });

            let variTumma = varioiHSL(tummaHSL.h, tummaHSL.s, tummaHSL.l);
            let variPunainen = varioiHSL(punainenHSL.h, punainenHSL.s, punainenHSL.l);
            let variHarja = varioiHSL(harjaHSL.h, harjaHSL.s, harjaHSL.l);

            let paavari = "", laikkavari = null;
            let onkoPunainenNakyy = false;

            if (pentuN === "NN") {
                paavari = variTumma;
            } else if (pentuN === "nn") {
                paavari = variPunainen;
                onkoPunainenNakyy = true;
            } else {
                onkoPunainenNakyy = true;
                if (Math.random() < 0.5) {
                    paavari = variPunainen; laikkavari = variTumma;
                } else {
                    paavari = variTumma; laikkavari = variPunainen;
                }
            }

            if (onkoPunainenNakyy && Math.random() < 0.5) {
                if (pentuH === "hh") {
                    variHarja = "#fce8a4";
                } else {
                    variHarja = onkoDiluutio ? varioiHSL(30, 60, 70) : varioiHSL(20, 80, 50);
                }
            }

            if (pentuS === "SS" && Math.random() < 0.5) {
                variHarja = "#ffffff";
            } else if (pentuS === "Ss" && Math.random() < 0.2) {
                variHarja = "#ffffff";
            }

            let onkoRaitaGeeni = pentuR.includes("R");
            let onkoTaplaGeeni = (pentuP === "pp");

            let kuviotyyppi = "eikuviota";
            if (onkoRaitaGeeni && onkoTaplaGeeni) {
                kuviotyyppi = "ocelot";
            } else if (onkoRaitaGeeni) {
                kuviotyyppi = "raita";
            } else if (onkoTaplaGeeni) {
                kuviotyyppi = "täplä";
            }

            let kuvioLimbs = false, kuvioBody = false, kuvioFace = false;
            if (kuviotyyppi !== "eikuviota") {
                if (pentuA.includes("A")) {
                    kuvioLimbs = true; kuvioBody = true; kuvioFace = true;
                } else if (pentuA === "aa" || pentuA === "aa1") {
                    kuvioLimbs = true; kuvioFace = true;
                } else if (pentuA === "a1a1") {
                    kuvioBody = true;
                }
            }

            let onkoExtraKorvat = kuvioFace && (Math.random() < 0.5);
            let onkoExtraKuono  = kuvioFace && (Math.random() < 0.5);

            // V-geenin logiikka: Jos vv -> haalea keskus, muuten (VV tai Vv) sama sävy kuin reunat ja 100% peittävyys
            let centerOpacity = (pentuV === "vv") ? (0.50 + Math.random() * 0.40) : 1.0;

            document.getElementById("tulos").innerText = 
                `Genotyyppi: ${currentGenotype}\n` +
                `Silmät: ${pentuEyeColor} | Nahka: ${pentuSkinColor} | Nenä: ${pentuNose}\n` +
                `Kuvio: ${kuviotyyppi.toUpperCase()} ${onkoDiluutio ? "(dd Diluutio)" : ""} ${(pentuV === "vv") ? "(vv vaalea keskus)" : "(V_ tasavärinen)"}`;

            let karvanPohja = onkoKihara ? "Untitled309_20261008214953.png" : "Untitled309_20261008214944.png";
            let ihoTiedosto = onkoKihara ? "Untitled309_20261009185045.png" : earsAndPawsSkinFile;

            piirraErillinenHarjaPentu({
                pohja: karvanPohja,
                pohjaHarja: onkoHarja ? (onkoKihara ? "Untitled309_20261008151613.png" : "Untitled309_20261008151605.png") : null,
                viiva: onkoKihara ? "Untitled309_20261008153435.png" : "Untitled309_20261008153442.png",
                viivaHarja: onkoHarja ? (onkoKihara ? "Untitled309_20261008153420.png" : "Untitled309_20261008153429.png") : null,
                kehoVari: paavari,
                laikkavari: laikkavari,
                harjaVari: variHarja,
                pentuS: pentuS,
                onkoGradient: onkoGradient,
                eyeColor: pentuEyeColor,
                eyeLineart: eyeLinearts[Math.floor(Math.random() * eyeLinearts.length)],
                skinColor: pentuSkinColor,
                noseSkin: noseData[pentuNose].skin,
                noseViiva: noseData[pentuNose].lineart,
                mouthLineart: mouthLinearts[Math.floor(Math.random() * mouthLinearts.length)],
                earsAndPawsSkin: ihoTiedosto,
                kuviotyyppi: kuviotyyppi,
                kuvioLimbs: kuvioLimbs,
                kuvioBody: kuvioBody,
                kuvioFace: kuvioFace,
                extraKorvat: onkoExtraKorvat ? faceExtraKorvat : null,
                extraKuono: onkoExtraKuono ? faceExtraKuono : null,
                centerOpacity: centerOpacity
            });
        }

        function lataaKuva(url) {
            return new Promise((resolve) => {
                if (!url) return resolve(null);
                const img = new Image();
                img.onload = () => resolve(img);
                img.onerror = () => resolve(null);
                img.src = url;
            });
        }

        function teeTaysinPeittavaksi(canvasCtx, width, height) {
            let imgData = canvasCtx.getImageData(0, 0, width, height);
            let data = imgData.data;
            for (let i = 3; i < data.length; i += 4) {
                if (data[i] > 20) {
                    data[i] = 255;
                } else {
                    data[i] = 0;
                }
            }
            canvasCtx.putImageData(imgData, 0, 0);
        }

        async function piirraErillinenHarjaPentu(opts) {
            const canvas = document.getElementById("canvas");
            const ctx = canvas.getContext("2d");
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            let selectedLimbsPattern = null, selectedBodyPattern = null, selectedFacePattern = null;

            if (opts.kuviotyyppi === "raita") {
                selectedLimbsPattern = stripeAssets.limbs[Math.floor(Math.random() * stripeAssets.limbs.length)];
                selectedBodyPattern = stripeAssets.body[Math.floor(Math.random() * stripeAssets.body.length)];
                selectedFacePattern = stripeAssets.face[Math.floor(Math.random() * stripeAssets.face.length)];
            } else if (opts.kuviotyyppi === "täplä") {
                selectedLimbsPattern = spotAssets.limbs[Math.floor(Math.random() * spotAssets.limbs.length)];
                selectedBodyPattern = spotAssets.body[Math.floor(Math.random() * spotAssets.body.length)];
                selectedFacePattern = spotAssets.face[Math.floor(Math.random() * spotAssets.face.length)];
            } else if (opts.kuviotyyppi === "ocelot") {
                const combinedLimbs = [...stripeAssets.limbs, ...spotAssets.limbs];
                selectedLimbsPattern = combinedLimbs[Math.floor(Math.random() * combinedLimbs.length)];
                selectedBodyPattern = ocelotAssets.body[Math.floor(Math.random() * ocelotAssets.body.length)];

                if (Math.random() < 0.5) {
                    selectedFacePattern = ocelotAssets.face[0];
                } else {
                    const combinedFaces = [...stripeAssets.face, ...spotAssets.face];
                    selectedFacePattern = combinedFaces[Math.floor(Math.random() * combinedFaces.length)];
                }
            }

            const [
                imgPohja, imgPohjaHarja, imgViiva, imgViivaHarja, 
                imgSilmät, imgSilmätLineArt, imgNoseSkin, imgNoseViiva, 
                imgMouthLineart, imgEarsAndPawsSkin,
                imgLimbsColor, imgLimbsOutline,
                imgBodyColor, imgBodyOutline,
                imgFaceColor, imgFaceOutline,
                imgExtraKorvat, imgExtraKuono
            ] = await Promise.all([
                lataaKuva(opts.pohja),
                lataaKuva(opts.pohjaHarja),
                lataaKuva(opts.viiva),
                lataaKuva(opts.viivaHarja),
                lataaKuva("Untitled309_20261008221009.png"),
                lataaKuva(opts.eyeLineart),
                lataaKuva(opts.noseSkin),
                lataaKuva(opts.noseViiva),
                lataaKuva(opts.mouthLineart),
                lataaKuva(opts.earsAndPawsSkin),
                (opts.kuvioLimbs && selectedLimbsPattern) ? lataaKuva(selectedLimbsPattern.color) : null,
                (opts.kuvioLimbs && selectedLimbsPattern) ? lataaKuva(selectedLimbsPattern.outline) : null,
                (opts.kuvioBody && selectedBodyPattern) ? lataaKuva(selectedBodyPattern.color) : null,
                (opts.kuvioBody && selectedBodyPattern) ? lataaKuva(selectedBodyPattern.outline) : null,
                (opts.kuvioFace && selectedFacePattern) ? lataaKuva(selectedFacePattern.color) : null,
                (opts.kuvioFace && selectedFacePattern) ? lataaKuva(selectedFacePattern.outline) : null,
                lataaKuva(opts.extraKorvat),
                lataaKuva(opts.extraKuono)
            ]);

            // VAIHE 1: KEHO POHJAVÄRILLE
            if (imgPohja) {
                const bodyCanvas = document.createElement("canvas");
                bodyCanvas.width = canvas.width; bodyCanvas.height = canvas.height;
                const bodyCtx = bodyCanvas.getContext("2d");

                bodyCtx.drawImage(imgPohja, 0, 0, canvas.width, canvas.height);
                bodyCtx.globalCompositeOperation = "source-in";

                bodyCtx.fillStyle = opts.kehoVari;
                bodyCtx.fillRect(0, 0, canvas.width, canvas.height);

                if (opts.laikkavari) {
                    bodyCtx.globalCompositeOperation = "source-atop";
                    piirraCalicoLaikut(bodyCtx, canvas.width, canvas.height, opts.laikkavari, 8);
                }

                if (opts.onkoGradient) {
                    bodyCtx.globalCompositeOperation = "source-atop";
                    piirraGradient(bodyCtx, canvas.width, canvas.height);
                }

                // KUVIOT: Korjattu kerrosjärjestys niin että ääriviivat ovat päällä eikä sotke kesustaa
                function parseToRgb(colorStr) {
                    if (colorStr.startsWith("hsl")) {
                        let dummy = document.createElement("div");
                        dummy.style.color = colorStr;
                        document.body.appendChild(dummy);
                        let computed = getComputedStyle(dummy).color;
                        document.body.removeChild(dummy);
                        let match = computed.match(/\d+/g);
                        return match ? { r: parseInt(match[0]), g: parseInt(match[1]), b: parseInt(match[2]) } : { r: 100, g: 50, b: 20 };
                    }
                    return hexToRgb(colorStr);
                }

                let baseRgb = parseToRgb(opts.kehoVari);
                // Muutettu niin, että kuviot ovat luonnostaan hieman pohjaväriä tummempia (kuten kissoilla)
                let centerFactor = 0.70 + Math.random() * 0.15; 

                let patternCenterColor = `rgb(${Math.round(baseRgb.r * centerFactor)}, ${Math.round(baseRgb.g * centerFactor)}, ${Math.round(baseRgb.b * centerFactor)})`;

                const combinedCenterCanvas = document.createElement("canvas");
                combinedCenterCanvas.width = canvas.width; combinedCenterCanvas.height = canvas.height;
                const combinedCenterCtx = combinedCenterCanvas.getContext("2d");

                const combinedOutlineCanvas = document.createElement("canvas");
                combinedOutlineCanvas.width = canvas.width; combinedOutlineCanvas.height = canvas.height;
                const combinedOutlineCtx = combinedOutlineCanvas.getContext("2d");

                function lisaaKuvioKokoelmaan(imgColor, imgOutline) {
                    if (imgColor) combinedCenterCtx.drawImage(imgColor, 0, 0, canvas.width, canvas.height);
                    if (imgOutline) combinedOutlineCtx.drawImage(imgOutline, 0, 0, canvas.width, canvas.height);
                }

                if (opts.kuvioLimbs) lisaaKuvioKokoelmaan(imgLimbsColor, imgLimbsOutline);
                if (opts.kuvioBody) lisaaKuvioKokoelmaan(imgBodyColor, imgBodyOutline);
                if (opts.kuvioFace) {
                    lisaaKuvioKokoelmaan(imgFaceColor, imgFaceOutline);
                    if (imgExtraKorvat) lisaaKuvioKokoelmaan(imgExtraKorvat, null);
                    if (imgExtraKuono)  lisaaKuvioKokoelmaan(imgExtraKuono, null);
                }

                // Piirretään kuvioiden täyttö värisävyllä
                combinedCenterCtx.globalCompositeOperation = "source-in";
                combinedCenterCtx.fillStyle = patternCenterColor;
                combinedCenterCtx.fillRect(0, 0, canvas.width, canvas.height);

                bodyCtx.save();
                bodyCtx.globalCompositeOperation = "multiply";
                bodyCtx.globalAlpha = opts.centerOpacity;
                bodyCtx.drawImage(combinedCenterCanvas, 0, 0);
                bodyCtx.restore();

                // Ääriviivat piirretään tummempana, mutta erillisellä tasolla ettei värit vuoda ristiin
                teeTaysinPeittavaksi(combinedOutlineCtx, canvas.width, canvas.height);
                combinedOutlineCtx.globalCompositeOperation = "source-in";
                let outlineR = Math.max(0, baseRgb.r - 40);
                let outlineG = Math.max(0, baseRgb.g - 40);
                let outlineB = Math.max(0, baseRgb.b - 40);
                combinedOutlineCtx.fillStyle = `rgb(${outlineR}, ${outlineG}, ${outlineB})`;
                combinedOutlineCtx.fillRect(0, 0, canvas.width, canvas.height);

                bodyCtx.save();
                bodyCtx.globalCompositeOperation = "multiply";
                bodyCtx.globalAlpha = 1.0;
                bodyCtx.drawImage(combinedOutlineCanvas, 0, 0);
                bodyCtx.restore();

                // S-geenin mukainen valkoisuuden määrä (SS vs Ss vs ss)
                if (opts.pentuS === "SS") {
                    bodyCtx.globalCompositeOperation = "source-atop";
                    piirraCalicoLaikut(bodyCtx, canvas.width, canvas.height, "#ffffff", 10);
                } else if (opts.pentuS === "Ss") {
                    bodyCtx.globalCompositeOperation = "source-atop";
                    piirraCalicoLaikut(bodyCtx, canvas.width, canvas.height, "#ffffff", 3);
                }

                bodyCtx.globalCompositeOperation = "destination-in";
                bodyCtx.drawImage(imgPohja, 0, 0, canvas.width, canvas.height);

                ctx.globalCompositeOperation = "source-over";
                ctx.drawImage(bodyCanvas, 0, 0);
            }

            // VAIHE 2: KEHON ÄÄRIVIIVAT
            ctx.globalCompositeOperation = "source-over";
            if (imgViiva) ctx.drawImage(imgViiva, 0, 0, canvas.width, canvas.height);

            // VAIHE 3: NAHKA
            if (imgNoseSkin || imgEarsAndPawsSkin) {
                const tempSkinCanvas = document.createElement("canvas");
                tempSkinCanvas.width = canvas.width; tempSkinCanvas.height = canvas.height;
                const tempSkinCtx = tempSkinCanvas.getContext("2d");

                if (imgEarsAndPawsSkin) tempSkinCtx.drawImage(imgEarsAndPawsSkin, 0, 0, canvas.width, canvas.height);
                if (imgNoseSkin) tempSkinCtx.drawImage(imgNoseSkin, 0, 0, canvas.width, canvas.height);

                tempSkinCtx.globalCompositeOperation = "source-in";
                tempSkinCtx.fillStyle = opts.skinColor;
                tempSkinCtx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.globalCompositeOperation = "source-over";
                ctx.drawImage(tempSkinCanvas, 0, 0);
            }

            // VAIHE 4: HARJA
            if (imgPohjaHarja) {
                const tempCanvas = document.createElement("canvas");
                tempCanvas.width = canvas.width; tempCanvas.height = canvas.height;
                const tempCtx = tempCanvas.getContext("2d");

                tempCtx.drawImage(imgPohjaHarja, 0, 0, canvas.width, canvas.height);
                tempCtx.globalCompositeOperation = "source-in";
                tempCtx.fillStyle = opts.harjaVari;
                tempCtx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.globalCompositeOperation = "source-over";
                ctx.drawImage(tempCanvas, 0, 0);
            }
            if (imgViivaHarja) ctx.drawImage(imgViivaHarja, 0, 0, canvas.width, canvas.height);

            // VAIHE 5: SILMÄT
            if (imgSilmät) {
                const tempEyeCanvas = document.createElement("canvas");
                tempEyeCanvas.width = canvas.width; tempEyeCanvas.height = canvas.height;
                const tempEyeCtx = tempEyeCanvas.getContext("2d");

                tempEyeCtx.drawImage(imgSilmät, 0, 0, canvas.width, canvas.height);
                tempEyeCtx.globalCompositeOperation = "source-in";
                tempEyeCtx.fillStyle = opts.eyeColor;
                tempEyeCtx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.globalCompositeOperation = "source-over";
                ctx.drawImage(tempEyeCanvas, 0, 0);
            }
            if (imgSilmätLineArt) {
                ctx.globalCompositeOperation = "source-over";
                ctx.drawImage(imgSilmätLineArt, 0, 0, canvas.width, canvas.height);
            }

            // VAIHE 6: NENÄ JA SUU
            if (imgNoseViiva) ctx.drawImage(imgNoseViiva, 0, 0, canvas.width, canvas.height);
            if (imgMouthLineart) ctx.drawImage(imgMouthLineart, 0, 0, canvas.width, canvas.height);
        }

        function lataaKuvaLaitteelle() {
            const canvas = document.getElementById("canvas");
            const latausLinkki = document.createElement("a");
            latausLinkki.download = `${currentGenotype}.png`;
            latausLinkki.href = canvas.toDataURL("image/png");
            document.body.appendChild(latausLinkki);
            latausLinkki.click();
            document.body.removeChild(latausLinkki);
        }
    </script>
</body>
</html>
